name: DCR Agent Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "dcr-agent-v*"

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      IVAAN_OPS_DEFAULT_URL: https://app.ivaanops.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install automation agent
        run: npm run automation-agent:install

      - name: Build automation agent
        run: npm run automation-agent:build

      - name: Install Playwright Chromium
        run: npm run automation-agent:playwright-chromium

      - name: Stage browsers for installer
        run: powershell -ExecutionPolicy Bypass -File scripts/stage-agent-playwright-browsers.ps1

      - name: Install desktop shell
        run: npm run automation-agent-desktop:install

      - name: Build desktop shell
        run: npm run automation-agent-desktop:build

      - name: Create Windows installer
        run: npm run automation-agent-desktop:dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IvaanOpsDCRAgentSetup
          path: packages/automation-agent-desktop/release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/automation-agent-desktop/release/*.exe
          generate_release_notes: true
